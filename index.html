<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Реши за меня</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --panel: #1a1a1a;
      --border: #303030;
      --text: #f5f5f5;
      --muted: #929292;
      --accent: #eeeeee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 18px 32px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 1px solid #414141;
      border-radius: 14px;
      background: #202020;
      font-size: 23px;
    }

    .brand {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .description {
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 650;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 112px;
      padding: 14px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      line-height: 1.7;
      transition: border-color .2s;
    }

    textarea:focus {
      border-color: #777777;
    }

    .hint {
      margin: 8px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .wheel-section {
      margin: 20px 0 10px;
      padding: 14px 0 0;
    }

    .wheel-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .pointer {
      position: absolute;
      z-index: 2;
      top: 1px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-top: 24px solid #f5f5f5;
      border-right: 12px solid transparent;
      border-left: 12px solid transparent;
      filter: drop-shadow(0 2px 3px #000);
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 14px 18px;
      border: 1px solid transparent;
      border-radius: 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, opacity .15s, background .15s;
    }

    button:active:not(:disabled) {
      transform: scale(.985);
    }

    button:disabled {
      cursor: default;
      opacity: .4;
    }

    .primary {
      background: var(--accent);
      color: #111111;
    }

    .primary:hover:not(:disabled) {
      background: #ffffff;
    }

    .secondary {
      margin-top: 10px;
      border-color: var(--border);
      background: #1a1a1a;
      color: var(--text);
    }

    .result-card {
      display: none;

margin-top: 20px;
      padding: 20px;
      border: 1px solid #383838;
      border-radius: 16px;
      background: #191919;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .result-card.visible {
      display: block;
      animation: appear .3s ease-out;
    }

    .result-label {
      color: var(--muted);
      font-size: 12px;
    }

    .result-value {
      margin-top: 8px;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: -.4px;
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .footer {
      margin-top: 26px;
      color: #666666;
      font-size: 11px;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 360px) {
      .app { padding: 20px 14px 28px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">◉</div>
      <div>
        <div class="brand">РЕШИ ЗА МЕНЯ</div>
        <div class="brand-subtitle">Когда сложно выбрать</div>
      </div>
    </header>

    <div class="eyebrow">Случайный выбор</div>
    <h1>Доверь решение<br>колесу</h1>
    <p class="description">
      Добавь варианты, запусти вращение и узнай, что выпадет.
    </p>

    <label class="field-label" for="options">Твои варианты</label>
    <textarea id="options" maxlength="2000">Пойти гулять
Остаться дома
Посмотреть фильм
Позвать друзей</textarea>
    <div class="hint">Каждый вариант — с новой строки. От 2 до 20 вариантов.</div>

    <section class="wheel-section">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
      </div>
    </section>

    <button id="spin" class="primary">Крутить колесо</button>
    <button id="send" class="secondary" disabled>
      Отправить результат в Telegram
    </button>

    <section id="resultCard" class="result-card">
      <div class="result-label">РЕШЕНИЕ ПРИНЯТО</div>
      <div id="result" class="result-value"></div>
    </section>

    <div id="status" class="status" aria-live="polite"></div>
    <footer class="footer">РЕШИ ЗА МЕНЯ · ТВОЙ ВЫБОР</footer>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const input = document.getElementById("options");
    const spinButton = document.getElementById("spin");
    const sendButton = document.getElementById("send");
    const resultCard = document.getElementById("resultCard");
    const resultBox = document.getElementById("result");
    const statusBox = document.getElementById("status");

    const colors = [
      "#292929", "#484848", "#353535", "#626262",
      "#242424", "#555555", "#303030", "#707070",
      "#414141", "#202020"
    ];

    let items = [];
    let rotation = 0;
    let spinning = false;
    let selected = null;

    function readOptions() {
      return input.value
        .split("\n")
        .map(item => item.trim())
        .filter(Boolean)
        .slice(0, 20);
    }

    function drawWheel() {
      items = readOptions();

      const center = canvas.width / 2;
      const radius = center - 14;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (items.length < 2) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#222222";
        ctx.fill();
        ctx.fillStyle = "#eeeeee";
        ctx.font = "22px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Добавь 2 варианта", center, center);
        return;
      }

      const slice = Math.PI * 2 / items.length;

      ctx.save();
      ctx.translate(center, center);

ctx.rotate(rotation);

      items.forEach((item, index) => {
        const start = -Math.PI / 2 + index * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();
        ctx.strokeStyle = "#151515";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.font = items.length > 10 ? "15px Arial" : "19px Arial";

        let label = item;
        const maxLength = items.length > 10 ? 12 : 18;

        if (label.length > maxLength) {
          label = label.slice(0, maxLength - 1) + "…";
        }

        ctx.fillText(label, radius - 24, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, 28, 0, Math.PI * 2);
      ctx.fillStyle = "#eeeeee";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fillStyle = "#171717";
      ctx.fill();

      ctx.restore();
    }

    function normalize(angle) {
      return ((angle % (Math.PI * 2)) + Math.PI * 2) %
        (Math.PI * 2);
    }

    function spin() {
      if (spinning) return;

      items = readOptions();

      if (items.length < 2) {
        statusBox.textContent = "Добавь минимум 2 варианта.";
        drawWheel();
        return;
      }

      spinning = true;
      selected = null;
      spinButton.disabled = true;
      sendButton.disabled = true;
      resultCard.classList.remove("visible");
      statusBox.textContent = "Колесо вращается…";

      const startRotation = rotation;
      const extraRotation =
        Math.PI * 2 * (6 + Math.random() * 3) +
        Math.random() * Math.PI * 2;
      const targetRotation = startRotation + extraRotation;
      const duration = 4200;
      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);

        rotation = startRotation +
          (targetRotation - startRotation) * eased;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
          return;
        }

        rotation = normalize(rotation);
        drawWheel();

        const slice = Math.PI * 2 / items.length;
        const index = Math.floor(
          normalize(-rotation) / slice
        ) % items.length;

        selected = items[index];
        spinning = false;
        spinButton.disabled = false;
        sendButton.disabled = false;

        resultBox.textContent = selected;
        resultCard.classList.add("visible");
        statusBox.textContent = "Готово. Решение выбрано.";
      }

      requestAnimationFrame(animate);
    }

    spinButton.addEventListener("click", spin);

    input.addEventListener("input", () => {
      if (spinning) return;

      selected = null;
      sendButton.disabled = true;
      resultCard.classList.remove("visible");
      statusBox.textContent = "";
      drawWheel();
    });

    sendButton.addEventListener("click", () => {
      if (!selected) return;

      if (tg && tg.initData) {
        tg.sendData(JSON.stringify({
          type: "wheel_result",
          result: selected
        }));
        statusBox.textContent = "Отправляем результат в Telegram…";
      } else {
        statusBox.textContent =
          "Чтобы отправить результат, открой колесо через бота в Telegram.";
      }
    });

    drawWheel();
  </script>
</body>
</html>
