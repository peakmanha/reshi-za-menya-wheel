<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101112">
  <title>Колесо фортуны — Реши за меня</title>
  <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101112;
      --panel: #191b1e;
      --panel-2: #202328;
      --text: #f4f5f6;
      --muted: #9298a1;
      --line: #30343a;
      --accent: #c7ff52;
      --accent-text: #171a10;
      --danger: #ff7777;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { width: min(100%, 520px); margin: 0 auto; padding: 24px 18px 32px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
    .brand { font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
    .tag { font-size: 11px; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 9px; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
    .subtitle { margin: 10px 0 22px; color: var(--muted); line-height: 1.5; font-size: 14px; }
    .wheel-card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 18px 14px 20px; }
    .wheel-wrap { position: relative; width: min(100%, 360px); aspect-ratio: 1; margin: 0 auto 18px; }
    canvas { display: block; width: 100%; height: 100%; }
    .pointer { position: absolute; z-index: 2; left: 50%; top: -3px; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid var(--accent); filter: drop-shadow(0 3px 4px #0008); }
    .hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 54px; height: 54px; border-radius: 50%; background: var(--bg); border: 5px solid #f4f5f6; box-shadow: 0 0 0 4px #10111255; pointer-events: none; }
    .spin { width: 100%; border: 0; border-radius: 15px; background: var(--accent); color: var(--accent-text); font-weight: 800; padding: 16px 18px; cursor: pointer; transition: transform .15s, opacity .15s; }
    .spin:active { transform: scale(.985); }
    .spin:disabled { opacity: .55; cursor: wait; }
    .result { min-height: 52px; margin-top: 14px; border: 1px solid var(--line); border-radius: 15px; padding: 12px 14px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .result strong { display: block; color: var(--text); font-size: 18px; margin-top: 3px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 2px 10px; gap: 12px; }
    .section-head h2 { font-size: 16px; margin: 0; }
    .count { color: var(--muted); font-size: 12px; }
    .options-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
    .option-list { display: grid; gap: 8px; }
    .option-row { display: flex; gap: 8px; align-items: center; }
    .option-row input { width: 100%; min-width: 0; background: var(--panel-2); color: var(--text); border: 1px solid transparent; outline: none; border-radius: 11px; padding: 12px; }
    .option-row input:focus { border-color: #65734a; }
    .remove { flex: 0 0 42px; height: 42px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 11px; cursor: pointer; font-size: 20px; }
    .remove:disabled { opacity: .25; cursor: default; }
    .small-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .secondary { border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); color: var(--text); padding: 12px 10px; cursor: pointer; }
    .secondary:disabled { opacity: .45; cursor: default; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 12px 2px 0; }
    .footer { text-align: center; color: #666c75; font-size: 11px; margin-top: 22px; }
    @media (max-width: 360px) { .app { padding: 18px 12px 24px; } .wheel-card { padding: 12px 10px 14px; } .hub { width: 44px; height: 44px; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div class="brand">Реши за меня</div>
      <div class="tag">КОЛЕСО ФОРТУНЫ</div>
    </div>
    <h1>Пусть решит<br>случай 🎡</h1>
    <p class="subtitle">Добавь варианты, нажми на кнопку и доверь выбор колесу.</p>

    <section class="wheel-card" aria-label="Колесо фортуны">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="720" height="720" aria-label="Колесо с вариантами"></canvas>
        <div class="hub"></div>
      </div>
      <button class="spin" id="spinButton">Крутить колесо</button>
      <div class="result" id="result" aria-live="polite">Твой результат появится здесь</div>
    </section>

    <div class="section-head">
      <h2>Твои варианты</h2>
      <span class="count" id="count">4 варианта</span>
    </div>
    <section class="options-panel">
      <div class="option-list" id="optionList"></div>
      <div class="small-actions">
        <button class="secondary" id="addButton">＋ Добавить</button>
        <button class="secondary" id="resetButton">Сбросить список</button>
      </div>
      <p class="hint">Нужно от 2 до 12 вариантов. Пустые строки не участвуют в выборе.</p>
    </section>
    <div class="footer">Твой выбор. Твои правила.</div>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#101112'); tg.setBackgroundColor('#101112'); } catch (e) {}
    }

    const defaultOptions = ['Кино', 'Кафе', 'Боулинг', 'Погулять'];
    const colors = ['#C7FF52', '#30343A', '#F2F3F4', '#555D67', '#A5E52E', '#25292E', '#DDE0E3', '#41474F', '#B7ED48', '#363B42', '#ECEEF0', '#69717C'];
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const optionList = document.getElementById('optionList');
    const spinButton = document.getElementById('spinButton');
    const addButton = document.getElementById('addButton');
    const resetButton = document.getElementById('resetButton');
    const resultBox = document.getElementById('result');
    const countBox = document.getElementById('count');
    let rotation = 0;
    let spinning = false;
    let options = [...defaultOptions];

    function cleanOptions() {
      return options.map(value => value.trim()).filter(Boolean).slice(0, 12);
    }

    function renderInputs() {
      optionList.innerHTML = '';
      options.forEach((value, index) => {
        const row = document.createElement('div');
        row.className = 'option-row';
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 60;
        input.value = value;
        input.placeholder = `Вариант ${index + 1}`;
        input.setAttribute('aria-label', `Вариант ${index + 1}`);
        input.addEventListener('input', () => {
          options[index] = input.value;
          drawWheel();
          updateCount();
        });
        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = 'Удалить вариант';
        remove.disabled = options.length <= 2;
        remove.addEventListener('click', () => {
          if (options.length <= 2) return;
          options.splice(index, 1);
          renderInputs();
          drawWheel();
          updateCount();
        });
        row.append(input, remove);
        optionList.appendChild(row);
      });
      addButton.disabled = options.length >= 12;
      updateCount();
    }

    function updateCount() {
      const n = cleanOptions().length;
      countBox.textContent = `${n} ${n === 1 ? 'вариант' : n >= 2 && n <= 4 ? 'варианта' : 'вариантов'}`;
    }

    function drawWheel() {
      const labels = cleanOptions();
      const size = canvas.width;
      const center = size / 2;
      const radius = size / 2 - 14;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(rotation);
      if (labels.length === 0) {
        ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fillStyle = '#25292E'; ctx.fill();
        ctx.restore(); return;
      }
      const slice = Math.PI * 2 / labels.length;
      labels.forEach((label, i) => {
        const start = -Math.PI / 2 + i * slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#101112';
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        const dark = ['#C7FF52', '#F2F3F4', '#A5E52E', '#DDE0E3', '#B7ED48', '#ECEEF0'].includes(colors[i % colors.length]);
        ctx.fillStyle = dark ? '#171A10' : '#FFFFFF';
        const maxText = labels.length > 8 ? 19 : labels.length > 5 ? 23 : 27;
        let display = label;
        if (display.length > 16) display = display.slice(0, 15) + '…';
        ctx.font = `700 ${maxText}px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif`;
        ctx.fillText(display, radius - 24, 0, radius * 0.56);
        ctx.restore();
      });
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#F4F5F6';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.restore();
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function spin() {
      if (spinning) return;
      const labels = cleanOptions();
      if (labels.length < 2) {
        resultBox.textContent = 'Добавь хотя бы два непустых варианта.';
        return;
      }
      spinning = true;
      spinButton.disabled = true;
      addButton.disabled = true;
      resetButton.disabled = true;
      resultBox.textContent = 'Колесо выбирает…';

      const winnerIndex = Math.floor(Math.random() * labels.length);
      const slice = Math.PI * 2 / labels.length;
      // Указатель стоит сверху. Центр выбранного сектора должен прийти к нему.
      const desired = -winnerIndex * slice - slice / 2;
      const current = ((rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const targetMod = ((desired % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      let delta = targetMod - current;
      if (delta < 0) delta += Math.PI * 2;
      const startRotation = rotation;
      const endRotation = rotation + Math.PI * 2 * 6 + delta;
      const startTime = performance.now();
      const duration = 4200;

      function frame(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        rotation = startRotation + (endRotation - startRotation) * easeOutCubic(progress);
        drawWheel();
        if (progress < 1) {
          requestAnimationFrame(frame);
        } else {
          rotation = endRotation;
          drawWheel();
          const winner = labels[winnerIndex];
          resultBox.innerHTML = `🎉 Выпал вариант:<strong></strong>`;
          resultBox.querySelector('strong').textContent = winner;
          spinning = false;
          spinButton.disabled = false;
          addButton.disabled = options.length >= 12;
          resetButton.disabled = false;
          if (tg && tg.HapticFeedback) {
            try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
          }
          // Если приложение открыто из бота через Web App-кнопку, отправляем результат боту.
          if (tg && tg.initData) {
            try {
              tg.sendData(JSON.stringify({ type: 'wheel_result', result: winner, options: labels }));
            } catch (e) {}
          }
        }
      }
      requestAnimationFrame(frame);
    }

    addButton.addEventListener('click', () => {
      if (options.length >= 12 || spinning) return;
      options.push('');
      renderInputs();
      drawWheel();
      const inputs = optionList.querySelectorAll('input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    resetButton.addEventListener('click', () => {
      if (spinning) return;
      options = [...defaultOptions];
      rotation = 0;
      resultBox.textContent = 'Твой результат появится здесь';
      renderInputs();
      drawWheel();
    });

    spinButton.addEventListener('click', spin);
    renderInputs();
    drawWheel();
  </script>
</body>
</html>
